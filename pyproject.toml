[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "ipam-demo"
version = "0.1.0"
description = "Scoped synthetic IPAM inventory foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.141.1", "uvicorn==0.50.1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/ipam_demo"]

[tool.uv]
package = true
